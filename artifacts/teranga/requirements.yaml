packages:
  "framer-motion": "For high-quality scroll animations, page transitions, and micro-interactions"
  "react-hook-form": "For robust contact form state management"
  "@hookform/resolvers": "For integrating Zod validation with the contact form"
  "zod": "For schema validation of the contact form"

images:
  - path: "artifacts/teranga/public/images/teranga-logo.png"
    description: "Elegant, minimalist restaurant logo featuring a stylized African acacia tree or leaf motif, terracotta and gold colors on a transparent background"
    aspect_ratio: "1:1"
  - path: "artifacts/teranga/public/images/pattern-bg.png"
    description: "Subtle, seamless, abstract African mudcloth or geometric line pattern in very light cream and beige tones, low contrast, used as a subtle background texture"
    aspect_ratio: "16:9"

notes:
  - The application is a single-page scrolling website with no backend required.
  - Form submissions will be simulated with a toast notification.
